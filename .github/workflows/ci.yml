name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python db/seed_build.py && pytest -q
      - run: ruff check . && lint-imports
      - name: no order-placement code, ever
        run: "! grep -rnE 'place_order|modify_order|place_gtt|cancel_order' --include=*.py . "
