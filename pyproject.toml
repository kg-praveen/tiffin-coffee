[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiffin-coffee-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "yfinance>=0.2", "kiteconnect>=5", "pandas>=2", "python-dotenv>=1"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "import-linter>=2"]

[tool.setuptools.packages.find]
include = ["engine*", "store*", "tools*", "usecases*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "UP", "B", "BLE", "I", "S", "RUF", "FURB", "PYI"]
per-file-ignores = {"tests/*" = ["S101"], "db/*" = ["E501"]}
[tool.mypy]
strict = true
files = ["engine", "store"]
[tool.importlinter]
root_packages = ["engine", "store", "tools", "usecases"]
include_external_packages = true
[[tool.importlinter.contracts]]
name = "engine is pure"
type = "forbidden"
source_modules = ["engine"]
forbidden_modules = ["tools", "store", "requests", "yfinance", "kiteconnect", "sqlite3"]
